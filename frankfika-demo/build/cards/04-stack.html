<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{--bg:#05070a;--ink:#f2f5f8;--muted:#8b96a3;--accent:#3ddc97;--accent2:#5b8cff;--line:rgba(255,255,255,.085)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Inter','Noto SC','PingFang SC',sans-serif;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:96px 96px;
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 42% 45%,#000 20%,transparent 80%);
    mask-image:radial-gradient(ellipse 85% 75% at 42% 45%,#000 20%,transparent 80%);
    opacity:0;animation:fadeIn 1s ease .1s forwards}
  .glow{position:absolute;width:1200px;height:1200px;border-radius:50%;left:34%;top:48%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(91,140,255,.14),transparent 62%);
    filter:blur(60px);opacity:0;animation:glowIn 2.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes glowIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 140px}
  .eyebrow{display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',monospace;font-size:21px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--accent2);margin-bottom:34px;
    opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.16,1,.3,1) .25s forwards}
  .eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 20px var(--accent2);
    animation:pulse 1.8s ease-in-out infinite}
  .eyebrow .bar{width:76px;height:1px;background:linear-gradient(90deg,var(--accent2),transparent)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  h2{font-family:'Noto SC',sans-serif;font-weight:800;font-size:76px;line-height:1.2;letter-spacing:-.015em;
    opacity:0;transform:translateY(30px);animation:up 1s cubic-bezier(.16,1,.3,1) .38s forwards}
  h2 span{color:var(--accent2)}

  .stack{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:58px;max-width:1560px}
  .row{display:flex;align-items:center;gap:26px;padding:26px 30px;border-radius:16px;
    border:1px solid rgba(255,255,255,.10);background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.012));
    opacity:0;transform:translateX(-28px);animation:rowIn .8s cubic-bezier(.16,1,.3,1) forwards}
  .row:nth-child(1){animation-delay:.68s}
  .row:nth-child(2){animation-delay:.8s}
  .row:nth-child(3){animation-delay:.92s}
  .row:nth-child(4){animation-delay:1.04s}
  .row:nth-child(5){animation-delay:1.16s}
  .row:nth-child(6){animation-delay:1.28s}
  @keyframes rowIn{to{opacity:1;transform:translateX(0)}}
  .row .k{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.16em;color:var(--muted);
    width:150px;flex-shrink:0;text-transform:uppercase}
  .row .v{font-family:'Noto SC',sans-serif;font-size:25px;font-weight:600}
  .row .v code{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--accent);
    background:rgba(61,220,151,.10);padding:4px 11px;border-radius:7px;border:1px solid rgba(61,220,151,.2)}
  .row .v small{display:block;font-family:'Noto SC',sans-serif;font-size:17px;color:var(--muted);
    font-weight:400;margin-top:5px}

  .corner{position:absolute;width:28px;height:28px;border:1px solid rgba(91,140,255,.5);opacity:0;
    animation:fadeIn .8s ease 1.5s forwards}
  .c-tl{left:54px;top:54px;border-right:0;border-bottom:0}
  .c-tr{right:54px;top:54px;border-left:0;border-bottom:0}
  .c-bl{left:54px;bottom:54px;border-right:0;border-top:0}
  .c-br{right:54px;bottom:54px;border-left:0;border-top:0}
  .wordmark{position:absolute;right:140px;bottom:92px;font-family:'JetBrains Mono',monospace;font-size:20px;
    letter-spacing:.22em;color:var(--muted);text-transform:uppercase;opacity:0;animation:fadeIn .9s ease 1.55s forwards}
</style>
</head>
<body data-duration="6">
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span><span class="bar"></span>UNDER THE HOOD</div>
    <h2>不是 PPT，是一个<span>真跑起来的产品</span></h2>
    <div class="stack">
      <div class="row"><div class="k">Frontend</div><div class="v"><code>React 18</code> + <code>Vite</code> + <code>Tailwind 4</code></div></div>
      <div class="row"><div class="k">Backend</div><div class="v"><code>Cloudflare Worker</code><small>流式 AI · D1 数据库 · AES-GCM 加密令牌</small></div></div>
      <div class="row"><div class="k">AI</div><div class="v"><code>MiniMax</code><small>只读公开资料与文章，回答带出处引用</small></div></div>
      <div class="row"><div class="k">Security</div><div class="v"><code>PBKDF2</code> + <code>HMAC</code><small>简历需访问码 · 按 IP 限流 · 服务端算分</small></div></div>
      <div class="row"><div class="k">Deploy</div><div class="v"><code>Cloudflare Pages</code><small>CI 验证通过即自动部署</small></div></div>
      <div class="row"><div class="k">Owner</div><div class="v"><code>/console</code><small>自然语言更新简历，先出 diff 再提交</small></div></div>
    </div>
  </div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="wordmark">frankfika.com</div>
</body>
</html>
