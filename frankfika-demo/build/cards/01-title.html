<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{
    --bg:#05070a; --ink:#f2f5f8; --muted:#8b96a3;
    --accent:#3ddc97; --accent2:#5b8cff; --line:rgba(255,255,255,.085);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Inter','Noto SC','PingFang SC','Hiragino Sans GB',sans-serif;
    position:relative;
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:96px 96px;
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 45% 45%,#000 20%,transparent 80%);
    mask-image:radial-gradient(ellipse 85% 75% at 45% 45%,#000 20%,transparent 80%);
    opacity:0;animation:fadeIn 1s ease .1s forwards;
  }
  .glow{position:absolute;width:1300px;height:1300px;border-radius:50%;left:42%;top:46%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(61,220,151,.14),transparent 62%);
    filter:blur(60px);opacity:0;animation:glowIn 2.4s cubic-bezier(.2,.7,.2,1) .15s forwards}
  .glow2{position:absolute;width:900px;height:900px;border-radius:50%;left:76%;top:76%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(91,140,255,.13),transparent 62%);
    filter:blur(70px);opacity:0;animation:glowIn 2.4s cubic-bezier(.2,.7,.2,1) .4s forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes glowIn{from{opacity:0;transform:translate(-50%,-50%) scale(.65)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 140px}
  .eyebrow{display:flex;align-items:center;gap:18px;
    font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--accent);margin-bottom:40px;opacity:0;transform:translateY(26px);
    animation:up .9s cubic-bezier(.16,1,.3,1) .3s forwards}
  .eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 20px var(--accent);animation:pulse 1.8s ease-in-out infinite}
  .eyebrow .bar{width:76px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  h1{font-family:'Noto SC','Space Grotesk',sans-serif;font-weight:800;
    font-size:112px;line-height:1.14;letter-spacing:-.02em;max-width:1720px}
  h1 .line{display:block;overflow:hidden;padding-bottom:6px;white-space:nowrap}
  h1 .line span{display:block;transform:translateY(102%);animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
  h1 .l1 span{animation-delay:.44s}
  h1 .l2 span{animation-delay:.60s}
  @keyframes rise{to{transform:translateY(0)}}
  .grad{background:linear-gradient(94deg,var(--accent) 0%,#7fe9bb 42%,var(--accent2) 108%);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .sub{margin-top:46px;font-size:30px;line-height:1.62;color:var(--muted);max-width:1020px;
    font-family:'Noto SC',sans-serif;font-weight:400;
    opacity:0;transform:translateY(24px);animation:up .95s cubic-bezier(.16,1,.3,1) 1s forwards}
  .sub b{color:var(--ink);font-weight:700}
  .sub .mono{font-family:'JetBrains Mono',monospace;font-size:28px;color:var(--accent);letter-spacing:-.01em}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  .url{position:absolute;left:140px;bottom:92px;display:flex;align-items:center;gap:16px;
    font-family:'JetBrains Mono',monospace;font-size:25px;color:var(--ink);
    opacity:0;transform:translateY(20px);animation:up .85s cubic-bezier(.16,1,.3,1) 1.28s forwards}
  .url .chip{padding:13px 26px;border:1px solid rgba(61,220,151,.45);border-radius:999px;
    background:rgba(61,220,151,.08);color:var(--accent);letter-spacing:.02em}
  .url .arrow{color:var(--muted)}

  .corner{position:absolute;width:28px;height:28px;border:1px solid rgba(61,220,151,.5);opacity:0;
    animation:fadeIn .8s ease 1.4s forwards}
  .c-tl{left:54px;top:54px;border-right:0;border-bottom:0}
  .c-tr{right:54px;top:54px;border-left:0;border-bottom:0}
  .c-bl{left:54px;bottom:54px;border-right:0;border-top:0}
  .c-br{right:54px;bottom:54px;border-left:0;border-top:0}

  .wordmark{position:absolute;right:140px;bottom:92px;font-family:'JetBrains Mono',monospace;
    font-size:20px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
    opacity:0;animation:fadeIn .9s ease 1.5s forwards}
</style>
</head>
<body data-duration="5.5">
  <div class="grid"></div><div class="glow"></div><div class="glow2"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span><span class="bar"></span>AI TWIN · 个人数字分身</div>
    <h1>
      <span class="line l1"><span>不是简历网站</span></span>
      <span class="line l2"><span>是一个<span class="grad">能聊天的我</span></span></span>
    </h1>
    <p class="sub">
      <span class="mono">frankfika.com</span> —— 打开网页，先跟我的 <b>AI 分身</b> 聊两句。<br />
      它读过我写过的全部文章，也记得我做过的事。
    </p>
  </div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="url"><span class="chip">frankfika.com</span><span class="arrow">→</span></div>
  <div class="wordmark">Product Demo · 2026</div>
</body>
</html>
