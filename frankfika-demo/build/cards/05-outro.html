<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{--bg:#05070a;--ink:#f2f5f8;--muted:#8b96a3;--accent:#3ddc97;--accent2:#5b8cff;--line:rgba(255,255,255,.085)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Inter','Noto SC','PingFang SC',sans-serif;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:96px 96px;
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 50%,#000 20%,transparent 80%);
    mask-image:radial-gradient(ellipse 85% 75% at 50% 50%,#000 20%,transparent 80%);
    opacity:0;animation:fadeIn 1s ease .1s forwards}
  .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:50%;top:48%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(61,220,151,.16),transparent 60%);
    filter:blur(70px);opacity:0;animation:glowIn 2.4s cubic-bezier(.2,.7,.2,1) .15s forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes glowIn{from{opacity:0;transform:translate(-50%,-50%) scale(.65)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 140px;text-align:center}
  .eyebrow{display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',monospace;font-size:21px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:38px;
    opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.16,1,.3,1) .3s forwards}
  .eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent);
    animation:pulse 1.8s ease-in-out infinite}
  .eyebrow .bar{width:76px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  h1{font-family:'Noto SC',sans-serif;font-weight:800;font-size:112px;line-height:1.16;letter-spacing:-.02em;
    opacity:0;transform:translateY(32px);animation:up 1.05s cubic-bezier(.16,1,.3,1) .45s forwards}
  h1 span{background:linear-gradient(94deg,var(--accent) 0%,#7fe9bb 45%,var(--accent2) 112%);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .cta{margin-top:60px;display:flex;align-items:center;gap:22px;
    opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.16,1,.3,1) .9s forwards}
  .cta .main{padding:22px 46px;border-radius:999px;background:var(--accent);color:#04120c;
    font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;letter-spacing:.01em;
    box-shadow:0 0 60px rgba(61,220,151,.34)}
  .cta .side{font-family:'Noto SC',sans-serif;font-size:24px;color:var(--muted);line-height:1.55}
  .cta .side b{color:var(--ink);font-weight:700}

  .foot{margin-top:52px;font-family:'JetBrains Mono',monospace;font-size:20px;color:var(--muted);
    letter-spacing:.06em;opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) 1.15s forwards}
  .foot .sep{color:rgba(255,255,255,.2);margin:0 14px}

  .corner{position:absolute;width:28px;height:28px;border:1px solid rgba(61,220,151,.5);opacity:0;
    animation:fadeIn .8s ease 1.4s forwards}
  .c-tl{left:54px;top:54px;border-right:0;border-bottom:0}
  .c-tr{right:54px;top:54px;border-left:0;border-bottom:0}
  .c-bl{left:54px;bottom:54px;border-right:0;border-top:0}
  .c-br{right:54px;bottom:54px;border-left:0;border-top:0}
</style>
</head>
<body data-duration="6">
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span><span class="bar"></span>TRY IT NOW</div>
    <h1>打开网站，<span>跟我聊聊</span></h1>
    <div class="cta">
      <div class="main">frankfika.com</div>
      <div class="side">公众号 / Bilibili / 视频号 <b>陈放Frank</b></div>
    </div>
    <div class="foot">AI 分身只读公开资料和文章，偶尔会说错<span class="sep">/</span>完整简历需访问码<span class="sep">/</span>GitHub · LinkedIn · X</div>
  </div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
</body>
</html>
