<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts.css" />
<style>
  :root{--bg:#05070a;--ink:#f2f5f8;--muted:#8b96a3;--accent:#3ddc97;--accent2:#5b8cff;--line:rgba(255,255,255,.085)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Inter','Noto SC','PingFang SC',sans-serif;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:96px 96px;
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 45% 45%,#000 20%,transparent 80%);
    mask-image:radial-gradient(ellipse 85% 75% at 45% 45%,#000 20%,transparent 80%);
    opacity:0;animation:fadeIn 1s ease .1s forwards}
  .glow{position:absolute;width:1100px;height:1100px;border-radius:50%;left:72%;top:40%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(91,140,255,.15),transparent 62%);
    filter:blur(60px);opacity:0;animation:glowIn 2.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
  @keyframes fadeIn{to{opacity:1}}
  @keyframes glowIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 140px}
  .eyebrow{display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',monospace;font-size:21px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:34px;
    opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.16,1,.3,1) .25s forwards}
  .eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent);
    animation:pulse 1.8s ease-in-out infinite}
  .eyebrow .bar{width:76px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  @keyframes up{to{opacity:1;transform:translateY(0)}}

  h2{font-family:'Noto SC',sans-serif;font-weight:800;font-size:86px;line-height:1.18;letter-spacing:-.015em;
    max-width:1120px;opacity:0;transform:translateY(30px);animation:up 1s cubic-bezier(.16,1,.3,1) .4s forwards}
  h2 em{font-style:normal;color:var(--accent)}

  .cards{display:flex;gap:26px;margin-top:64px}
  .card{flex:1;padding:34px 34px 38px;border:1px solid rgba(255,255,255,.11);border-radius:20px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    position:relative;overflow:hidden;
    opacity:0;transform:translateY(38px);
    animation:cardIn .85s cubic-bezier(.16,1,.3,1) forwards}
  .card:nth-child(1){animation-delay:.72s}
  .card:nth-child(2){animation-delay:.86s}
  .card:nth-child(3){animation-delay:1.0s}
  @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
  .card::after{content:'';position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--accent),transparent);
    transform:scaleX(0);transform-origin:left;animation:wipe .9s cubic-bezier(.16,1,.3,1) forwards}
  .card:nth-child(1)::after{animation-delay:1.0s}
  .card:nth-child(2)::after{animation-delay:1.14s}
  .card:nth-child(3)::after{animation-delay:1.28s}
  @keyframes wipe{to{transform:scaleX(1)}}
  .card .n{font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--accent);letter-spacing:.16em;
    margin-bottom:20px;opacity:0;animation:fadeIn .6s ease forwards}
  .card:nth-child(1) .n{animation-delay:1.1s}
  .card:nth-child(2) .n{animation-delay:1.24s}
  .card:nth-child(3) .n{animation-delay:1.38s}
  .card h3{font-family:'Noto SC',sans-serif;font-size:37px;font-weight:700;margin-bottom:14px;line-height:1.3}
  .card p{font-family:'Noto SC',sans-serif;font-size:22px;line-height:1.62;color:var(--muted)}
  .card .tag{display:inline-block;margin-top:20px;padding:7px 15px;border-radius:999px;
    border:1px solid rgba(61,220,151,.34);background:rgba(61,220,151,.08);color:var(--accent);
    font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.06em}

  .corner{position:absolute;width:28px;height:28px;border:1px solid rgba(61,220,151,.5);opacity:0;
    animation:fadeIn .8s ease 1.5s forwards}
  .c-tl{left:54px;top:54px;border-right:0;border-bottom:0}
  .c-tr{right:54px;top:54px;border-left:0;border-bottom:0}
  .c-bl{left:54px;bottom:54px;border-right:0;border-top:0}
  .c-br{right:54px;bottom:54px;border-left:0;border-top:0}
  .wordmark{position:absolute;right:140px;bottom:92px;font-family:'JetBrains Mono',monospace;font-size:20px;
    letter-spacing:.22em;color:var(--muted);text-transform:uppercase;opacity:0;animation:fadeIn .9s ease 1.55s forwards}
</style>
</head>
<body data-duration="6">
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span><span class="bar"></span>CAPABILITIES</div>
    <h2>它能替你回答的三类问题</h2>
    <div class="cards">
      <div class="card">
        <div class="n">01 / CHAT</div>
        <h3>我在做什么</h3>
        <p>产品、代码、融资、公司治理、生态与内容——五件具体的事，每一件都有一手证据。</p>
        <span class="tag">公开资料 + 文章检索</span>
      </div>
      <div class="card">
        <div class="n">02 / READS</div>
        <h3>我写过什么</h3>
        <p>《Hermes Agent 白皮书》《AI Agent 伴读手册》，还有 15 万字开源指南，全部可检索。</p>
        <span class="tag">带出处引用</span>
      </div>
      <div class="card">
        <div class="n">03 / MATCH</div>
        <h3>我们合不合适</h3>
        <p>星座、八字、性格、脑力、认知——五关测出匹配度，满 70 分解锁微信。</p>
        <span class="tag">服务端算分 · 不存储</span>
      </div>
    </div>
  </div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="wordmark">frankfika.com</div>
</body>
</html>
